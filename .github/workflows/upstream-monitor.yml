name: Upstream Monitor

# Monitor AndyMik90/Auto-Claude:main for new releases/commits
# Updates UPSTREAM_STATUS.md when new commits are available

on:
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering for testing

permissions:
  contents: write

env:
  UPSTREAM_REPO: AndyMik90/Auto-Claude
  UPSTREAM_BRANCH: main
  FORK_BRANCH: snowdroog-clean

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Check for new upstream commits
        id: check
        run: |
          # Get commit counts
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/${{ env.UPSTREAM_BRANCH }})
          AHEAD_COUNT=$(git rev-list --count upstream/${{ env.UPSTREAM_BRANCH }}..HEAD)

          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          echo "ahead_count=$AHEAD_COUNT" >> $GITHUB_OUTPUT

          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Update status file
        if: steps.check.outputs.has_updates == 'true'
        run: |
          BEHIND=${{ steps.check.outputs.behind_count }}
          AHEAD=${{ steps.check.outputs.ahead_count }}

          cat > UPSTREAM_STATUS.md << 'HEADER'
          # Upstream Sync Status

          > Auto-generated by upstream-monitor workflow

          HEADER

          echo "**Last checked:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md
          echo "| Metric | Value |" >> UPSTREAM_STATUS.md
          echo "|--------|-------|" >> UPSTREAM_STATUS.md
          echo "| Upstream | \`${{ env.UPSTREAM_REPO }}:${{ env.UPSTREAM_BRANCH }}\` |" >> UPSTREAM_STATUS.md
          echo "| Fork branch | \`${{ env.FORK_BRANCH }}\` |" >> UPSTREAM_STATUS.md
          echo "| Commits behind | **$BEHIND** |" >> UPSTREAM_STATUS.md
          echo "| Commits ahead | $AHEAD |" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md

          echo "## New Upstream Commits" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md
          git log HEAD..upstream/${{ env.UPSTREAM_BRANCH }} --oneline --format="- \`%h\` %s (%an, %ar)" -n 20 >> UPSTREAM_STATUS.md

          if [ "$BEHIND" -gt 20 ]; then
            echo "" >> UPSTREAM_STATUS.md
            echo "_...and $(($BEHIND - 20)) more commits_" >> UPSTREAM_STATUS.md
          fi

          echo "" >> UPSTREAM_STATUS.md
          echo "## Files Changed" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md
          echo "\`\`\`" >> UPSTREAM_STATUS.md
          git diff --stat HEAD..upstream/${{ env.UPSTREAM_BRANCH }} | tail -n 20 >> UPSTREAM_STATUS.md
          echo "\`\`\`" >> UPSTREAM_STATUS.md

          echo "" >> UPSTREAM_STATUS.md
          echo "## Sync Instructions" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md
          echo "\`\`\`bash" >> UPSTREAM_STATUS.md
          echo "# Fetch latest upstream" >> UPSTREAM_STATUS.md
          echo "git fetch origin ${{ env.UPSTREAM_BRANCH }}" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md
          echo "# Cherry-pick specific commits" >> UPSTREAM_STATUS.md
          echo "git cherry-pick <commit-hash>" >> UPSTREAM_STATUS.md
          echo "" >> UPSTREAM_STATUS.md
          echo "# Or merge all upstream changes" >> UPSTREAM_STATUS.md
          echo "git checkout ${{ env.FORK_BRANCH }}" >> UPSTREAM_STATUS.md
          echo "git merge origin/${{ env.UPSTREAM_BRANCH }}" >> UPSTREAM_STATUS.md
          echo "\`\`\`" >> UPSTREAM_STATUS.md

      - name: Clear status file if up to date
        if: steps.check.outputs.has_updates == 'false'
        run: |
          cat > UPSTREAM_STATUS.md << EOF
          # Upstream Sync Status

          > Auto-generated by upstream-monitor workflow

          **Last checked:** $(date -u '+%Y-%m-%d %H:%M UTC')

          ✅ **Fork is up to date with upstream**

          | Metric | Value |
          |--------|-------|
          | Upstream | \`${{ env.UPSTREAM_REPO }}:${{ env.UPSTREAM_BRANCH }}\` |
          | Fork branch | \`${{ env.FORK_BRANCH }}\` |
          | Commits ahead | ${{ steps.check.outputs.ahead_count }} |
          EOF

      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add status file (handles both new and modified)
          git add UPSTREAM_STATUS.md

          # Check if there's anything to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update upstream sync status [skip ci]"
            git push origin ${{ env.FORK_BRANCH }}
            echo "Status file committed and pushed"
          fi

      - name: Summary
        run: |
          echo "## Upstream Monitor Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream:** ${{ env.UPSTREAM_REPO }}:${{ env.UPSTREAM_BRANCH }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Fork behind:** ${{ steps.check.outputs.behind_count }} commits" >> $GITHUB_STEP_SUMMARY
          echo "- **Fork ahead:** ${{ steps.check.outputs.ahead_count }} commits" >> $GITHUB_STEP_SUMMARY
          echo "- **Has updates:** ${{ steps.check.outputs.has_updates }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.has_updates }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 See [UPSTREAM_STATUS.md](../blob/${{ env.FORK_BRANCH }}/UPSTREAM_STATUS.md) for details" >> $GITHUB_STEP_SUMMARY
          fi
